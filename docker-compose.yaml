version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ILOVECHIKEN
      POSTGRES_DB: systemreporter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  api:
    build: .
    pid: host
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:ILOVECHIKEN@db:5432/systemreporter
      JWT_SECRET: change-this-development-secret-key
      AUTH_USERNAME: admin
      AUTH_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./Monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./Monitoring/rules:/etc/prometheus/rules:ro,Z
    ports:
      - "9090:9090"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
  
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./Monitoring/Grafana/provisioning/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro,Z
      - ./Monitoring/Grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro,Z
      - ./Monitoring/Grafana/provisioning/dashboard/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro,Z
      - ./Monitoring/Grafana/provisioning/dashboard:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./Monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro,Z
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.1.0
    user: "0:0"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./Monitoring/promtail-config.yml:/etc/promtail/config.yml:ro,Z
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      - api
      - grafana
      - prometheus
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  loki_data:
  promtail_positions:
  
